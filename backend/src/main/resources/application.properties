server.port=${PORT:${SERVER_PORT:8085}}

# Database Configuration with environment variable overrides
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sentinel_db}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:manya@31}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
sentinel.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
sentinel.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Application & Logging
logging.level.com.sentinel=INFO
logging.level.org.springframework.security=WARN
spring.main.allow-bean-definition-overriding=true

# Initial Admin Bootstrap Configuration
sentinel.bootstrap.secret=${BOOTSTRAP_SECRET:SentinelBootstrap2026!SecureKey}
sentinel.bootstrap.enabled=${BOOTSTRAP_ENABLED:true}
